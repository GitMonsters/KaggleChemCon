# 10 merged groups of 120 vectors and 60 copies, 3.80x the reference (the published recipe,
# merged_10x120x54.toml, also cuts 6 copies per group: 3.83x).
# Seed: the public group-compression (26, 60, 30) factorization, merged in pairs to (13, 120, 60).
# About 3 hours of training on a Kaggle T4 (~16 ms per step), then ~15 minutes of rounding.

seed = "group26"
merge = 2
shape = [10, 120, 60]

# Drop one merged group at a time: a 2,000-step fade, then 150,000 steps (error_2 before rounding:
# 12.4, 15.1 and 16.6 mHa).
[[train]]
groups = 12
fade = 2000
fit = 150000
lr_final = 1e-5

[[train]]
groups = 11
fade = 2000
fit = 150000
lr_final = 1e-5

[[train]]
groups = 10
fade = 2000
fit = 150000
lr_final = 1e-5

# Keep training at 10 groups (fresh optimizer, warm-up): 15.7 mHa.
[[train]]
groups = 10
fit = 150000
lr = 3e-4
lr_final = 2e-6
warmup = 300

# Progressive 10-bit rounding with long refits: 19.6 mHa (the gate is 20).
[round]
brot = 10
stage_steps = 3000
final_steps = 8000

# Refit w and W at fixed words, spending the error budget left after rounding on lambda_eff
# (49.3 -> 48.2: E_gap drops from its convex floor at fixed w, 4.085 Ha, to the gate's 3.92).
[refit]
target = 19.92

[build]
qrom = "four"
shots = 64
